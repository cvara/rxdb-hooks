# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

orbs:
  # The Node.js orb contains a set of prepackaged CircleCI configuration you can utilize
  # Orbs reduce the amount of configuration required for common tasks.
  # See the orb documentation here: https://circleci.com/developer/orbs/orb/circleci/node
  node: circleci/node@4.7
  # Third party orb. Needs to be enabled via circle-ci: an organization admin must opt-in to
  # using third party orbs in Organization Security settings.
  codecov: codecov/codecov@3.2.2

jobs:
  # Lint, typecheck, and run the test suite against the recorded
  # devDependency version of rxdb (currently 14.x).
  test:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: yarn
      - run:
          name: Run linter
          command: yarn lint
      - run:
          name: Run typechecks
          command: yarn typecheck
      - run:
          name: Run tests
          command: yarn test
      - codecov/upload:
          file: coverage/lcov.info

  # Run the test suite against an alternative rxdb major. Parametrized so
  # we can add new majors without copy/pasting the whole job body.
  test-rxdb-version:
    parameters:
      rxdb_version:
        type: string
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: yarn
      - run:
          name: Run tests against rxdb << parameters.rxdb_version >>
          command: scripts/test-rxdb.sh << parameters.rxdb_version >>

workflows:
  test-matrix:
    jobs:
      - test
      - test-rxdb-version:
          name: test-rxdb-15
          rxdb_version: "15"
      - test-rxdb-version:
          name: test-rxdb-16
          rxdb_version: "16"
